spring.application.name=server

# TiDB Cloud (MySQL-compatible) Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?sslMode=VERIFY_IDENTITY&allowPublicKeyRetrieval=true&useSSL=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Spring Data JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# H2 Console fallback if needed
spring.h2.console.enabled=true
