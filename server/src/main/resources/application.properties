spring.application.name=server
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Several authenticated endpoints currently return JPA entity graphs (user,
# cart and orders). Keep the persistence context open until JSON serialization
# so their lazy collections can be read without producing HTTP 500 responses.
spring.jpa.open-in-view=true

spring.datasource.hikari.initialization-fail-timeout=30000

spring.h2.console.enabled=true

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsManagerConfigurer=ERROR
